[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opensentiment"
version = "0.1.0"
description = "Open-source sentiment and bias analysis library"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["nlp", "sentiment", "bias", "analysis"]
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.0.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "redis>=5.0.0",
    "asyncpg>=0.28.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "prometheus-client>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "isort>=5.0",
    "mypy>=0.900",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
multi_line_output = 3 